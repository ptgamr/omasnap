name: Standalone Studio on Ubuntu

on:
  workflow_dispatch:
  pull_request:
    paths:
      - studio/**
      - src/studio*
      - src/zoom-track*
      - src/overlay-chrome*
      - tests/studio*
      - tests/zoom-track*
      - CMakeLists.txt
      - .github/workflows/studio-ubuntu.yml

permissions:
  contents: read

jobs:
  studio:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Ubuntu build and runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build python3-venv ca-certificates ffmpeg \
            libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev libfontconfig1 libdbus-1-3 \
            libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libsm6 libice6 \
            libpulse0 libasound2t64 libva2 libva-drm2 libva-x11-2 \
            libwayland-client0 libwayland-cursor0 libwayland-egl1

      - name: Install side-by-side Qt SDK
        run: |
          python3 -m venv "$RUNNER_TEMP/aqt"
          "$RUNNER_TEMP/aqt/bin/pip" install aqtinstall
          "$RUNNER_TEMP/aqt/bin/python" -m aqt install-qt \
            linux desktop 6.8.3 linux_gcc_64 -O "$RUNNER_TEMP/Qt" -m qtmultimedia

      - name: Build and test only Studio
        env:
          QT_FORCE_STDERR_LOGGING: "1"
        run: |
          "$RUNNER_TEMP/Qt/6.8.3/gcc_64/bin/qt-cmake" -S studio -B build-studio -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build-studio --parallel 4
          ctest --test-dir build-studio --output-on-failure
          cmake --install build-studio --prefix "$RUNNER_TEMP/studio-stage"
          QT_QPA_PLATFORM=offscreen "$RUNNER_TEMP/studio-stage/bin/omasnap-studio" --version
